[package]
name = "msqlx"
readme = "README.md"
documentation = "https://docs.rs/sqlx"
description = "Temporary fork of sqlx with unreleased fixes. 🧰 The Rust SQL Toolkit. An async, pure Rust SQL crate featuring compile-time checked queries without a DSL. PostgreSQL only."
version = "0.9.0-msqlx.2"
license = "MIT OR Apache-2.0"
edition = "2021"
repository = "https://github.com/launchbadge/sqlx"
keywords = ["database", "async", "postgres"]
categories = ["database", "asynchronous"]
authors = [
    "Ryan Leckey <leckey.ryan@gmail.com>",
    "Austin Bonander <austin.bonander@gmail.com>",
    "Chloe Ross <orangesnowfox@gmail.com>",
    "Daniel Akhterov <akhterovd@gmail.com>",
]
rust-version = "1.94.0"

[lib]
name = "sqlx"

[features]
default = ["json"]

# Pure cfg-gate for JSON type support; serde/serde_json are always available.
json = []

# Compile in rustls TLS support. Crypto provider is fixed to aws-lc-rs;
# no trust roots are bundled (callers supply their own via
# `PgConnectOptions::ssl_root_cert` / `ssl_root_cert_from_pem`).
tls-rustls = ["dep:rustls", "rustls/aws-lc-rs"]

# Type Integration features
bigdecimal = ["dep:bigdecimal", "dep:num-bigint"]
bit-vec = ["dep:bit-vec"]
chrono = ["dep:chrono"]
ipnet = ["dep:ipnet"]
ipnetwork = ["dep:ipnetwork"]
mac_address = ["dep:mac_address"]
rust_decimal = ["dep:rust_decimal", "rust_decimal/maths"]
time = ["dep:time"]
uuid = ["dep:uuid"]
bstr = ["dep:bstr"]

[dependencies]
# Runtime (tokio is mandatory)
tokio = { version = "1.25.0", features = ["time", "net", "sync", "fs", "io-util", "rt"], default-features = false }

# TLS. Only rustls itself; provider is picked via the `tls-rustls` feature
# (fixed to `aws-lc-rs`).
rustls = { version = "0.23.24", default-features = false, features = ["std", "tls12"], optional = true }

# Futures crates
futures-core = { version = "0.3.32", default-features = false }
futures-util = { version = "0.3.32", default-features = false, features = ["alloc", "sink", "io"] }

# Cryptographic Primitives
hkdf = { version = "0.13.0" }
hmac = { version = "0.13.0", default-features = false }
rand = { version = "0.10.1", features = ["thread_rng"], default-features = false }
sha2 = { version = "0.11.0", default-features = false }

# Type Integrations
bigdecimal = { version = "0.4.0", optional = true }
bit-vec = { version = "0.8", optional = true }
chrono = { version = "0.4.34", default-features = false, features = ["std", "clock"], optional = true }
ipnet = { version = "2.3.0", optional = true }
ipnetwork = { version = "0.21.1", optional = true }
mac_address = { version = "1.1.5", optional = true }
rust_decimal = { version = "1.36.0", default-features = false, features = ["std"], optional = true }
time = { version = "0.3.47", features = ["formatting", "parsing", "macros"], optional = true }
uuid = { version = "1.12.1", optional = true }
num-bigint = { version = "0.4.3", optional = true }

# Serde (used unconditionally by connection::describe and the JSON types)
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = { version = "1.0.142", features = ["raw_value"] }

# Misc
atoi = "2.0"
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
bitflags = { version = "2.4", default-features = false }
byteorder = { version = "1.4.3", default-features = false, features = ["std"] }
bstr = { version = "1.0.1", default-features = false, features = ["std"], optional = true }
bytes = "1.2.0"
either = "1.6.1"
hashlink = "0.11.0"
hex = "0.4.3"
itoa = "1.0.5"
memchr = { version = "2.5.0", default-features = false }
percent-encoding = "2.3.0"
smallvec = { version = "1.13.1" }
stringprep = "0.1.2"
thiserror = { version = "2.0.18", default-features = false, features = ["std"] }
tracing = { version = "0.1.37" }
url = { version = "2.2.2" }

[dev-dependencies]
anyhow = "1.0.58"
time_ = { version = "0.3.47", package = "time" }
env_logger = "0.11"
tokio = { version = "1.25.0", features = ["full"] }
trybuild = "1.0.53"
paste = "1.0.6"

[lints.rust.unexpected_cfgs]
level = 'warn'

[lints.clippy]
# https://github.com/launchbadge/sqlx/issues/3440
cast_possible_truncation = 'deny'
cast_possible_wrap = 'deny'
cast_sign_loss = 'deny'
disallowed_methods = 'deny'
mod_module_files = 'deny'

[[test]]
name = "postgres"
path = "tests/postgres/postgres.rs"
required-features = []

[[test]]
name = "postgres-types"
path = "tests/postgres/types.rs"
required-features = []

[[test]]
name = "postgres-error"
path = "tests/postgres/error.rs"
required-features = []
